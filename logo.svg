<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rurumo">
  <title>Rurumo · 如如动</title>
  <!-- 如如动：同一个东西，动了一下之后的样子。实心块是原位，描边块是动过去的位置，一道短弧是路径。 -->
  <rect width="64" height="64" rx="16" fill="#F0552C"/>
  <rect x="13" y="29" width="22" height="22" rx="7" fill="#FFFFFF"/>
  <rect x="29" y="13" width="22" height="22" rx="7" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
  <path d="M35 29 Q36.5 22.5 29 20" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
</svg>
